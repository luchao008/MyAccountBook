server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── 压缩 ──────────────────────────────────────────────────────────
    # 与 deploy/nginx.conf 同一套策略：预压缩优先（scripts/precompress.mjs 生成 .gz），
    # 动态 gzip 兜底。详细理由见那份配置的注释，这里不重复。
    gzip_static on;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    # ⚠️ 不要加 brotli 指令：nginx:alpine 官方镜像没有编译 brotli 模块，
    #    写 `brotli on` 会让 nginx 直接启动失败（unknown directive）。

    # ── 缓存 ──────────────────────────────────────────────────────────
    # 中台是 vben 构建的，产物分三个目录存放，**文件名全部带内容 hash**
    # （已核对：js/ 47 个、css/ 7 个、jse/ 1 个，无一带遗漏）。
    # 内容一变文件名就变，所以可以放心长缓存。

    location /js/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /css/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /jse/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 入口 HTML：里面写着当次构建的 hash 文件名，缓存住就等于把用户锁在旧版本上。
    # no-cache 是"每次都回来验证"，配合 ETag 命中时只回 304，几乎无开销。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # ⚠️ `_app.config.js` 是 vben 的**运行时配置**（205 字节，不带 hash）。
    #    它是部署后可改的开关（如标题、主题），一旦被长缓存，改了配置用户也看不到 ——
    #    而且这种"配置明明改了却不生效"极难排查。所以强制每次验证。
    location = /_app.config.js {
        add_header Cache-Control "no-cache";
    }

    # 中台是 hash 路由（#/...），静态资源直接命中；
    # 兜底回 index.html 以防将来切 history 模式。
    # 兜底路径同样不缓存，否则换版本后用户看到的还是旧页面。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 接口反代到后端容器（同域，浏览器无跨域）
    location /api/ {
        proxy_pass http://backend:7001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
