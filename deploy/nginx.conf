server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── 压缩 ──────────────────────────────────────────────────────────
    # 两条指令是**叠加**关系，不是二选一：
    #   gzip_static —— 优先找同名的 `.gz`（由 scripts/precompress.mjs 在构建时生成）。
    #                  直接吐文件，运行时 CPU 归零。
    #   gzip        —— 找不到 `.gz` 时现场压的兜底。
    # 只开 gzip_static 的话，任何没预压过的文件（新增的、后端直接吐的）就完全不压；
    # 只开 gzip 的话，每次冷请求都要现场压一遍同样的静态文件。两个都开才没有短板。
    gzip_static on;
    gzip on;
    # 预压缩的 .gz 内容与源文件逐字节一致，级别在构建时已经拉满（9）；
    # 这里的 5 只作用于**动态兜底**那条路径 —— 现场压是每次请求都做的事，
    # 6→9 的收益只有百分之几、CPU 却显著上升，不划算。
    gzip_comp_level 5;
    # 与 precompress.mjs 的 MIN_SIZE 对齐：太小的文件压完省不了多少，
    # 白搭一个响应头。两处阈值必须一致，否则会出现"预压了但静态路径不生效"的错觉。
    gzip_min_length 1024;
    # text/html 不在列表里是**故意的**：nginx 只要开了 gzip 就一定会压它，
    # 写进来反而多余（nginx 会容忍，但容易让人误以为漏了什么）。
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;
    # 让缓存（浏览器/CDN）按 Accept-Encoding 分开存两份，
    # 否则不支持 gzip 的客户端可能拿到 .gz 的字节流。
    gzip_vary on;
    # 压缩后端反代的响应。后端自己有 koa-compress（阈值同样 1KB），
    # 已经带 Content-Encoding 的响应 nginx 不会重复压；这条只兜住后端漏压的那些。
    gzip_proxied any;

    # ⚠️ 不要加 brotli 指令：nginx:alpine 官方镜像没有编译 brotli 模块，
    #    写 `brotli on` 会让 nginx 直接启动失败（unknown directive）。

    # ── 缓存 ──────────────────────────────────────────────────────────
    # 总原则：**文件名带内容 hash 的才能长缓存**。
    # 产物文件名形如 index-DZ6yBRNl.js，内容一变文件名就变，所以缓存一辈子也安全。

    # 构建产物：文件名带 hash → 一年 + immutable。
    # immutable 是告诉浏览器"刷新时也不用回来验证"，省掉一次条件请求（304）。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 分类图标：94 张 PNG，文件名是拼音（**不带 hash**），靠 URL 上的 ?v=<目录内容 hash> 区分版本
    # （见 frontend/src/utils/catIcon.ts 与 vite.config.ts 的 __CAT_ICON_VERSION__）。
    # 图标没变 → 版本号不变 → 回访用户直接命中缓存；换了图标 → 版本号变 → 立刻生效。
    # 所以这里能放心用长缓存。
    location /static/cat-icons/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /static/ 下的**其余**文件：logo.png、app-icon.png、tabbar/*.png —— 都是固定名、**不带版本号**。
    # 这里刻意只给 7 天而不是一年：将来换了 logo，老用户最多 7 天后就能看到新的，
    # 而不是被缓存锁住一年（那种问题表现为"我明明换了图，怎么还是旧的"，极难排查）。
    location /static/ {
        add_header Cache-Control "public, max-age=604800";
    }

    # 入口 HTML 绝不能长缓存：它里面写着当次构建的 hash 文件名。
    # 缓存住 index.html 就等于把用户永远锁在旧版本上。
    # no-cache 不是"不缓存"，是"每次都回来验证"—— 配合 ETag 命中时只回 304，几乎无开销。
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 前端是 hash 路由（#/pages/...），静态资源直接命中；
    # 兜底回 index.html 以防将来切 history 模式。
    location / {
        try_files $uri $uri/ /index.html;
        # 兜底路径（深链接）同样不能缓存，否则换版本后用户看到的还是旧页面
        add_header Cache-Control "no-cache";
    }

    # ── 接口反代到后端容器（同域，浏览器无跨域）────────────────────────
    #
    # ⚠️ **接口响应的压缩由应用层负责**（后端 koa-compress，见
    #    src/middleware/compress.middleware.ts），不是这一层。
    #    所以**绝对不要**在这里加 `proxy_set_header Accept-Encoding "";`：
    #    那会把客户端的 Accept-Encoding 抹掉，后端认为客户端不支持 gzip
    #    于是不再压缩 —— 而 nginx 这边 `gzip_proxied any` 又只压"未压缩的"
    #    代理响应，结果接口体积悄悄回到未压缩状态，且没有任何报错。
    #    （本项目不靠这个头解决"上游不支持 gzip"的问题，因为上游就是自己的 Koa。）
    #
    #    上面的 `gzip` / `gzip_static` 面向的是**静态文件**；两者作用域不重叠：
    #    静态走 nginx、/api 走应用层，各自独立，互不重复压。
    location /api/ {
        proxy_pass http://backend:7001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 流水导入用 JSON+base64 承载 xlsx，请求体可达数 MB
        client_max_body_size 16m;
    }
}
