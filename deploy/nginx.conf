server {
    # host 网络下直接监听宿主端口（web=8080）。
    # IPv4 + IPv6 都监听：只写 80/8080 在群晖（bindv6only=1）会丢掉 IPv6。
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端是 hash 路由（#/pages/...），静态资源直接命中；
    # 兜底回 index.html 以防将来切 history 模式。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 接口反代到后端（host 网络：同宿主回环 7001；backend 只监听 127.0.0.1）
    location /api/ {
        proxy_pass http://127.0.0.1:7001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 流水导入用 JSON+base64 承载 xlsx，请求体可达数 MB
        client_max_body_size 16m;
    }
}
